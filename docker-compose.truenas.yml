# The STABLE instance for TrueNAS SCALE (Apps → Discover Apps → ⋮ → Install
# via YAML). Tracks `latest`, which is only built from the main branch — so
# it moves exactly when a dev→main pull request merges, never in between.
services:
  ancestormap:
    image: ghcr.io/martemagua/ancestor-map:latest
    # Restarting the app fetches the newest `latest` — which only moves when
    # a pull request is merged into main, so it never surprises you. Pin a
    # released version instead (e.g. :v0.1.0) if you want a restart to be
    # guaranteed to change nothing at all.
    pull_policy: always
    container_name: ancestormap
    user: "568:568"
    ports:
      - "4322:4322"
    environment:
      TZ: Europe/Berlin
      DATA_DIR: /data
      BACKUP_KEEP: "30"
    volumes:
      - /mnt/YOUR-POOL/apps/ancestormap:/data
    restart: unless-stopped
